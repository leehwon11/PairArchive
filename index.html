<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교환일기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app" class="page"></main>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  // 코드가 실패하면 흰 화면 대신 원인을 보여줘요
  function showBoot(msg) {
    var el = document.getElementById('app');
    if (el && !el.children.length) el.innerHTML = '<div class="empty"><span class="hand">시작하지 못했어요</span>' + String(msg).replace(/</g, '&lt;') + '<br><br>F12 → Console 탭 빨간 줄을 캡처해서 보내주세요.</div>';
  }
  window.addEventListener('error', function (e) { showBoot(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { showBoot(e.reason && e.reason.message ? e.reason.message : e.reason); });
  setTimeout(function () { showBoot('8초가 지나도 화면이 안 떠요. 인터넷 연결이나 js/config.js 의 URL·키를 확인해주세요.'); }, 8000);
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
